cx:
  data-dir: data
  output-dir: output
  review-dir: review
  db-path: cx.db
  ollama:
    base-url: http://localhost:11434
    classify-model: qwen2.5:7b   # 88/91 vs 81/91 for 3b; see docs/experiments/classification
    brief-model: qwen2.5:3b      # its bottom line passes every check
    timeout: 120s

spring:
  application:
    name: cx-trends
  datasource:
    url: jdbc:sqlite:${cx.db-path}
    hikari:
      maximum-pool-size: 4
  main:
    banner-mode: off

logging:
  level:
    root: warn
    dev.cxtrends: info
    dev.cxtrends.CxTrendsApplication: warn
